# Pi-hole DNS + DHCP Server
# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOYMENT: docker-compose (NOT Swarm stack)
# REASON: Host network mode required for DHCP broadcast
# Port: 6001 (Admin UI), 53 (DNS), 67 (DHCP)
# ═══════════════════════════════════════════════════════════════════════════════
name: cubeos-pihole
services:
  pihole:
    image: pihole/pihole:latest
    container_name: cubeos-pihole
    hostname: cubeos-pihole
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../appdata/etc-pihole:/etc/pihole
      # NOTE: /etc/dnsmasq.d/ volume removed — Pi-hole v6 disables dnsmasq.d
      # drop-ins by default. All dnsmasq config via pihole.toml / REST API.
    environment:
      - TZ=${TZ:-UTC}
      # --- Web UI ---
      - FTLCONF_webserver_port=6001
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:-cubeos}
      # --- DNS core ---
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_dns_upstreams=1.1.1.1;8.8.8.8
      - FTLCONF_dns_dnssec=false
      # --- Local domain (never forward *.cubeos.cube) ---
      - FTLCONF_dns_domain_name=cubeos.cube
      - FTLCONF_dns_domain_local=true
      - FTLCONF_dns_domainNeeded=true
      - FTLCONF_dns_bogusPriv=true
      - FTLCONF_dns_expandHosts=false
      # --- DHCP range (static infrastructure — set once, never changes at runtime) ---
      # NOTE: dhcp.active is NOT set here. It's managed dynamically:
      #   - At boot: configure_pihole_dhcp() in cubeos-boot-lib.sh sets it via pihole-FTL --config
      #   - At runtime: CubeOS API sets it via Pi-hole v6 REST API (PATCH /api/config/dhcp/active)
      # Setting FTLCONF_dhcp_active here would make it read-only in Pi-hole v6,
      # blocking the API from enabling/disabling DHCP per network mode.
      - FTLCONF_dhcp_start=10.42.24.10
      - FTLCONF_dhcp_end=10.42.24.250
      - FTLCONF_dhcp_router=10.42.24.1
      - FTLCONF_dhcp_netmask=255.255.255.0
      # --- Offline resilience ---
      - FTLCONF_dns_replyWhenBusy=ALLOW
      - FTLCONF_dns_blocking_active=false
      # --- Wildcard DNS: *.cubeos.cube -> 10.42.24.1 ---
      # NOTE: misc.dnsmasq_lines is NOT set here. It's managed dynamically:
      #   - At boot: configure_pihole_dhcp() sets it via pihole-FTL --config
      #     (includes both address=/cubeos.cube/10.42.24.1 AND per-mode
      #      no-dhcp-interface directives)
      #   - At runtime: CubeOS API sets it via Pi-hole v6 REST API
      # Setting FTLCONF_misc_dnsmasq_lines here would make it read-only,
      # blocking the API from adding no-dhcp-interface=eth0 per mode.
      # The wildcard DNS is also backed by custom.list individual entries.
    env_file:
      - /cubeos/config/defaults.env
    cap_add:
      - NET_ADMIN
      - NET_RAW
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:6001/admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "cubeos.type=system"
      - "cubeos.category=infrastructure"
      - "cubeos.port=6001"
      - "cubeos.fqdn=pihole.cubeos.cube"
      - "cubeos.deployment=compose"
      - "cubeos.description=Pi-hole DNS + DHCP Server"
