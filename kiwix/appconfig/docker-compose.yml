# Kiwix Offline Content Library
# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOYMENT: Docker Swarm stack
# PURPOSE: Serve offline ZIM content (Wikipedia, Wiktionary, etc.)
# Port: 6043 (Kiwix web UI)
# Image: Pre-loaded in local registry at build time
#
# Deploy: docker stack deploy -c docker-compose.yml --resolve-image=never kiwix
# ═══════════════════════════════════════════════════════════════════════════════

services:
  kiwix:
    image: localhost:5000/kiwix/kiwix-serve:${KIWIX_TAG:-3.8.1}
    hostname: cubeos-kiwix
    ports:
      - target: 8080
        published: 6043
        protocol: tcp
        mode: host
    volumes:
      - /cubeos/data/kiwix:/data:ro
    command: "*.zim"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      labels:
        - "cubeos.type=platform"
        - "cubeos.category=library"
        - "cubeos.port=6043"
        - "cubeos.fqdn=kiwix.cubeos.cube"
        - "cubeos.deployment=swarm"
        - "cubeos.description=Kiwix Offline Library"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    external: true
    name: cubeos-network
