# CubeOS Dashboard
# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOYMENT: Docker Swarm stack
# Port: 6011 (Web UI)
# CRITICAL: Internal port is 8087, NOT 80!
#
# Deploy: docker stack deploy -c docker-compose.yml --resolve-image=never cubeos-dashboard
# ═══════════════════════════════════════════════════════════════════════════════

services:
  cubeos-dashboard:
    image: localhost:5000/cubeos-app/dashboard:${DASHBOARD_TAG:-latest}
    hostname: cubeos-dashboard
    ports:
      - target: 8087
        published: 6011
        protocol: tcp
        mode: host
    environment:
      - TZ=${TZ:-UTC}
      # Use docker_gwbridge gateway — always reachable from Swarm containers
      # regardless of network mode (AP up/down, wifi_client, eth_client, etc.)
      - API_URL=http://${DOCKER_HOST_GW:-172.16.1.1}:${API_PORT:-6010}
      - DOCS_URL=http://${DOCKER_HOST_GW:-172.16.1.1}:${DOCS_INDEXER_PORT:-6032}
    env_file:
      - /cubeos/config/defaults.env
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      labels:
        - "cubeos.type=platform"
        - "cubeos.category=platform"
        - "cubeos.port=6011"
        - "cubeos.fqdn=cubeos.cube"
        - "cubeos.deployment=swarm"
        - "cubeos.description=CubeOS Dashboard"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8087/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
    external: true
    name: cubeos-network
