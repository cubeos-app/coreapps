# CubeOS File Manager (Dufs) - Swarm Stack
# Web-based file manager with HTTP Basic Auth
# Password synced by CubeOS API via compose update + stack redeploy
services:
  filebrowser:
    image: sigoden/dufs:latest
    command: /data --port 6013 --auth "admin:cubeos@/:rw" --allow-all
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "cubeos.type=system"
        - "cubeos.port=6013"
        - "cubeos.description=Web File Manager"
    volumes:
      - type: bind
        source: /
        target: /data
    ports:
      - "6013:6013"
    networks:
      - cubeos-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:6013/ || [ $? -eq 6 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  cubeos-network:
    external: true
