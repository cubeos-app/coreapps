# =============================================================================
# CubeOS Coreapps Pipeline — Validate, Deploy, Restart
# =============================================================================
#
# This pipeline manages Docker Compose and Swarm service CONFIGS only.
# Source code for HAL and docsindex lives in their own repos with their
# own CI pipelines that build and push images to GHCR.
#
# What this pipeline does:
#   1. Validates all docker-compose.yml files
#   2. Detects changed apps via git diff (on GPU VM)
#   3. Rsyncs configs to Pi over SSH
#   4. Restarts changed services on Pi over SSH
#
stages:
  - validate
  - deploy
  - restart

variables:
  CUBEOS_SUBNET: "10.42.24.0/24"
  CUBEOS_GATEWAY: "10.42.24.1"
  CUBEOS_DOMAIN: "cubeos.cube"
  # Service classification
  COMPOSE_SERVICES: "pihole npm cubeos-hal terminal"
  STACK_SERVICES: "registry chromadb cubeos-api cubeos-dashboard cubeos-docsindex filebrowser dozzle kiwix ollama"

validate-compose:
  stage: validate
  image: registry-gitlab.nuclearlighters.net/products/cubeos/coreapps/ci-utils:latest
  tags:
    - multiarch
  script:
    - |
      # Create dummy env files for validation (real files are on Pi)
      mkdir -p /cubeos/config
      touch /cubeos/config/defaults.env
      touch /cubeos/config/secrets.env

      for dir in */; do
        if [ -f "${dir}appconfig/docker-compose.yml" ]; then
          echo "Checking ${dir}..."
          docker compose -f "${dir}appconfig/docker-compose.yml" config -q || exit 1
        fi
      done
      echo "All compose files valid"
  rules:
    - if: $CI_COMMIT_BRANCH

shellcheck:
  stage: validate
  image: registry-gitlab.nuclearlighters.net/products/cubeos/coreapps/ci-utils:latest
  tags:
    - multiarch
  script:
    - find . -name "*.sh" -type f -exec shellcheck -x {} \;
  rules:
    - if: $CI_COMMIT_BRANCH
  allow_failure: true

# -----------------------------------------------------------------------------
# DEPLOY — Detect changes, rsync to Pi, run post-sync logic (via SSH)
# -----------------------------------------------------------------------------
deploy:
  stage: deploy
  tags: [multiarch]
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync git
    - eval $(ssh-agent -s)
    - echo "$CI_DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${PI_DEPLOY_ADDR} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # --- Detect changed apps (locally on GPU VM, git checkout is here) ---
    - |
      CHANGED_APPS=""
      if [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        CHANGED_APPS=$(git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" 2>/dev/null \
          | grep -E '^[^/]+/(appconfig|appdata)/' \
          | cut -d'/' -f1 \
          | sort -u \
          | tr '\n' ' ' \
          | sed 's/ $//' || true)
      fi

      # Fallback: check for new apps by querying Pi
      if [ -z "$CHANGED_APPS" ]; then
        echo "No changes detected via git diff, checking for new apps..."
        for dir in */; do
          app="${dir%/}"
          if [ -d "${dir}appconfig" ]; then
            EXISTS=$(ssh ${PI_DEPLOY_HOST} "test -d /cubeos/coreapps/${app} && echo yes || echo no")
            if [ "$EXISTS" = "no" ]; then
              CHANGED_APPS="$CHANGED_APPS $app"
            fi
          fi
        done
        CHANGED_APPS=$(echo "$CHANGED_APPS" | xargs)
      fi

      echo "Changed apps: ${CHANGED_APPS:-none}"

    # --- Rsync entire repo to Pi staging area ---
    - |
      echo "Syncing configs to Pi..."
      rsync -az --delete \
        -e "ssh -o ServerAliveInterval=15" \
        --exclude='.git' \
        --exclude='.gitlab-ci.yml' \
        --exclude='scripts/ci-deploy.sh' \
        --exclude='scripts/ci-restart.sh' \
        ./ ${PI_DEPLOY_HOST}:/tmp/coreapps-sync/
      echo "  Rsync complete"

    # --- Run post-sync logic on Pi ---
    - scp scripts/ci-deploy.sh ${PI_DEPLOY_HOST}:/tmp/ci-deploy-coreapps.sh
    - |
      ssh -o ServerAliveInterval=15 ${PI_DEPLOY_HOST} \
        "bash /tmp/ci-deploy-coreapps.sh"
    - ssh ${PI_DEPLOY_HOST} "rm -f /tmp/ci-deploy-coreapps.sh"

    # --- Write changed apps for restart stage ---
    - echo "$CHANGED_APPS" > changed_apps.txt
    - echo "Deploy stage complete"
  after_script:
    - kill $SSH_AGENT_PID 2>/dev/null || true
  artifacts:
    paths:
      - changed_apps.txt
    expire_in: 10 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production

# -----------------------------------------------------------------------------
# RESTART — Restart changed services on Pi (via SSH)
# -----------------------------------------------------------------------------
restart-changed:
  stage: restart
  tags: [multiarch]
  image: alpine:latest
  needs:
    - deploy
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$CI_DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${PI_DEPLOY_ADDR} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      CHANGED_APPS=$(cat changed_apps.txt 2>/dev/null | xargs || true)

      if [ -z "$CHANGED_APPS" ]; then
        echo "No app changes detected, skipping restart"
        exit 0
      fi

      echo "Apps to restart: $CHANGED_APPS"
    - scp scripts/ci-restart.sh ${PI_DEPLOY_HOST}:/tmp/ci-restart-coreapps.sh
    - |
      ssh -o ServerAliveInterval=15 ${PI_DEPLOY_HOST} \
        "GHCR_TOKEN='${GHCR_TOKEN}' \
         GHCR_USER='${GHCR_USER}' \
         CHANGED_APPS='$(cat changed_apps.txt | xargs)' \
         bash /tmp/ci-restart-coreapps.sh"
    - ssh ${PI_DEPLOY_HOST} "rm -f /tmp/ci-restart-coreapps.sh"
  after_script:
    - kill $SSH_AGENT_PID 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
