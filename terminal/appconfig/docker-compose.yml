# Terminal Service (ttyd)
# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOYMENT: Docker Compose (NOT Swarm — requires privileged + host PID + host network)
# PURPOSE: Web-based terminal for host shell access
# Port: 6042 (ttyd web UI)
# Image: Pre-loaded in local registry at build time
#
# Deploy: DOCKER_DEFAULT_PLATFORM=linux/arm64 docker compose -f docker-compose.yml up -d --pull never
# ═══════════════════════════════════════════════════════════════════════════════

services:
  terminal:
    image: localhost:5000/tsl0922/ttyd:latest
    container_name: cubeos-terminal
    restart: unless-stopped
    volumes:
      - /:/host
    environment:
      - TZ=${TZ:-UTC}
    command: ttyd -p 6042 -W -t fontSize=14 -t theme={"background":"#1a1b26"} bash
    privileged: true
    pid: host
    network_mode: host
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      - "cubeos.type=platform"
      - "cubeos.category=system"
      - "cubeos.port=6042"
      - "cubeos.fqdn=terminal.cubeos.cube"
      - "cubeos.description=Web Terminal"
