# CubeOS Document Indexer
# Port: 6032
# Syncs documentation from Git, indexes into ChromaDB for RAG,
# and serves docs API for the dashboard.

services:
  cubeos-docsindex:
    image: ghcr.io/cubeos-app/cubeos-docsindex:latest
    ports:
      - target: 8080
        published: 6032
        protocol: tcp
        mode: host
    volumes:
      - /cubeos/docs:/cubeos/docs
    environment:
      - TZ=${TZ:-UTC}
      - LISTEN_ADDR=:8080
      - DOCS_REPO_URL=
      - DOCS_LOCAL_PATH=/cubeos/docs
      # Ollama/ChromaDB disabled — docsindex runs in filesystem mode
      # Set to empty to override any values from defaults.env
      - OLLAMA_HOST=
      - OLLAMA_PORT=
      - CHROMADB_HOST=
      - CHROMADB_PORT=
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-6}
      - CHUNK_SIZE=${CHUNK_SIZE:-500}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
    env_file:
      - /cubeos/config/defaults.env
    networks:
      - cubeos-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 60s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      cubeos.type: "ai"
      cubeos.category: "ai"
      cubeos.port: "6032"
      cubeos.description: "CubeOS Document Indexer"
      cubeos.fqdn: "docs.cubeos.cube"
      cubeos.deployment: "swarm"

networks:
  cubeos-network:
    external: true
