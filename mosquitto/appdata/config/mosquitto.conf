# Mosquitto MQTT Broker Configuration
# Port 1883: MQTT protocol (published as 6040 on host)
# Port 9001: WebSocket protocol (published as 6041 on host)

# MQTT listener
listener 1883
protocol mqtt

# WebSocket listener
listener 9001
protocol websockets

# Authentication (anonymous for local mesh bridge use)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
