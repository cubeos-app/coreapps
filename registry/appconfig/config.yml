version: 0.1
log:
  level: info
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
  maintenance:
    uploadpurging:
      enabled: true
      age: 168h
      interval: 24h
      dryrun: false
http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]
# NOTE: proxy block REMOVED — it turned this into a pull-through cache
# (read-only mirror of Docker Hub) which breaks:
#   1. Local image push (offline app installation)
#   2. Offline operation (requires internet to proxy)
# The registry is now a standalone local registry for CubeOS images.
